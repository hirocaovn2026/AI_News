name: Daily Bilingual News Digest

on:
  schedule:
    # 23:00 UTC = 06:00 AM Vietnam Time (UTC+7) every day
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline tests
        run: pytest pipeline/tests -v

      - name: Generate daily EN-VI digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/generate_digest.py --output-dir data --max-per-topic 10

      - name: Commit and push updated data
        run: |
          git config user.name "globalbrief-bot"
          git config user.email "globalbrief-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(news): update daily bilingual digest ($(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d))"
            git push
          fi
